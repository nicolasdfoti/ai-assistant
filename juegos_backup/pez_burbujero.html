<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pez Burbujero</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a4d68; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="juego"></canvas>
<script>
// Pez Burbujero: nadá con las flechas y reventá solo las burbujas del color que pide arriba.
// Si reventás una de otro color, perdés una vida. ¡El color cambia cada tanto!

const canvas = document.getElementById('juego');
const ctx = canvas.getContext('2d');
let W, H, u;

function ajustar() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  u = Math.min(W, H) / 100;
}
addEventListener('resize', ajustar);
ajustar();

// --- Teclado ---
const teclas = {};
addEventListener('keydown', (e) => {
  if (e.key.startsWith('Arrow')) e.preventDefault();
  teclas[e.key] = true;
  if (e.key === 'Enter' && estado !== 'jugando') empezar();
});
addEventListener('keyup', (e) => { teclas[e.key] = false; });

const COLORES = [
  { nombre: 'ROJAS', valor: '#ff5d73' },
  { nombre: 'VERDES', valor: '#7bd389' },
  { nombre: 'AZULES', valor: '#4fa3ff' },
  { nombre: 'AMARILLAS', valor: '#ffd23f' },
];

// --- Estado (posiciones de 0 a 1) ---
let estado = 'inicio';
let pez, burbujas, puntos, vidas, objetivo, cambioColor, proxima, aviso, destello, tiempo, record = 0;
const algas = Array.from({ length: 9 }, (_, i) => ({ x: (i + 0.5) / 9, alto: 0.1 + Math.random() * 0.15, fase: Math.random() * 6 }));

function empezar() {
  pez = { x: 0.5, y: 0.5, vx: 0, vy: 0, mira: 1 };
  burbujas = [];
  puntos = 0;
  vidas = 3;
  objetivo = Math.floor(Math.random() * COLORES.length);
  cambioColor = 8;
  proxima = 0;
  aviso = 1.5;
  destello = 0;
  tiempo = 0;
  estado = 'jugando';
}

function nuevaBurbuja() {
  // Una de cada tres es del color pedido, así siempre hay para atrapar
  const color = Math.random() < 0.35 ? objetivo : Math.floor(Math.random() * COLORES.length);
  burbujas.push({ x: 0.05 + Math.random() * 0.9, y: 1.08, r: 3 + Math.random() * 2.5, color, fase: Math.random() * 6, vel: 0.08 + Math.random() * 0.08 + tiempo / 900 });
}

function actualizar(dt) {
  tiempo += dt;

  // El pez acelera con las flechas y frena de a poco, como en el agua
  const empuje = 1.6 * dt;
  if (teclas.ArrowLeft) { pez.vx -= empuje; pez.mira = -1; }
  if (teclas.ArrowRight) { pez.vx += empuje; pez.mira = 1; }
  if (teclas.ArrowUp) pez.vy -= empuje;
  if (teclas.ArrowDown) pez.vy += empuje;
  pez.vx *= 1 - Math.min(1, dt * 2.5);
  pez.vy *= 1 - Math.min(1, dt * 2.5);
  pez.x = Math.max(0.04, Math.min(0.96, pez.x + pez.vx * dt));
  pez.y = Math.max(0.15, Math.min(0.92, pez.y + pez.vy * dt));

  // Cada tanto cambia el color pedido
  cambioColor -= dt;
  if (cambioColor <= 0) {
    let nuevo;
    do nuevo = Math.floor(Math.random() * COLORES.length); while (nuevo === objetivo);
    objetivo = nuevo;
    cambioColor = 8;
    aviso = 1.5;
  }
  aviso = Math.max(0, aviso - dt);
  destello = Math.max(0, destello - dt);

  proxima -= dt;
  if (proxima <= 0) {
    nuevaBurbuja();
    proxima = Math.max(0.3, 0.9 - tiempo / 100);
  }

  for (const b of burbujas) {
    b.y -= b.vel * dt;
    b.fase += dt * 3;
    const dx = (b.x + Math.sin(b.fase) * 0.01 - pez.x) * W;
    const dy = (b.y - pez.y) * H;
    if (Math.hypot(dx, dy) < (b.r + 4) * u) {
      b.reventada = true;
      if (b.color === objetivo) puntos++;
      else { vidas--; destello = 0.3; }
    }
  }
  burbujas = burbujas.filter((b) => !b.reventada && b.y > -0.1);

  if (vidas <= 0) {
    estado = 'fin';
    record = Math.max(record, puntos);
  }
}

// --- Dibujo ---
function texto(t, x, y, tam, color) {
  ctx.font = `bold ${tam * u}px "Trebuchet MS", sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.fillText(t, x, y);
}

function dibujarPez(x, y, mira, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(mira, 1);
  // Cola que se mueve
  ctx.fillStyle = '#ff9f1c';
  ctx.beginPath();
  ctx.moveTo(-4 * u, 0);
  ctx.lineTo(-7.5 * u, (-2.5 + Math.sin(t * 10) * 0.6) * u);
  ctx.lineTo(-7.5 * u, (2.5 + Math.sin(t * 10) * 0.6) * u);
  ctx.closePath();
  ctx.fill();
  // Cuerpo
  ctx.fillStyle = '#ffbf69';
  ctx.beginPath();
  ctx.ellipse(0, 0, 5 * u, 3.2 * u, 0, 0, Math.PI * 2);
  ctx.fill();
  // Ojo
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(2.4 * u, -0.8 * u, 1.1 * u, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1b1b1b';
  ctx.beginPath();
  ctx.arc(2.7 * u, -0.8 * u, 0.55 * u, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function dibujarBurbuja(b) {
  const x = (b.x + Math.sin(b.fase) * 0.01) * W, y = b.y * H, r = b.r * u;
  ctx.fillStyle = COLORES[b.color].valor;
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.beginPath();
  ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.25, 0, Math.PI * 2);
  ctx.fill();
}

function dibujarFondo(t) {
  const degrade = ctx.createLinearGradient(0, 0, 0, H);
  degrade.addColorStop(0, '#0a4d68');
  degrade.addColorStop(1, '#05263a');
  ctx.fillStyle = degrade;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#2a9d8f';
  ctx.lineWidth = 1.5 * u;
  ctx.lineCap = 'round';
  for (const a of algas) {
    ctx.beginPath();
    ctx.moveTo(a.x * W, H);
    ctx.quadraticCurveTo(a.x * W + Math.sin(t + a.fase) * 3 * u, H * (1 - a.alto / 2), a.x * W + Math.sin(t * 1.3 + a.fase) * 4 * u, H * (1 - a.alto));
    ctx.stroke();
  }
}

function dibujar(t) {
  dibujarFondo(t);

  if (estado === 'inicio') {
    dibujarPez(W / 2, H * 0.27, 1, t);
    texto('Pez Burbujero', W / 2, H * 0.48, 9, '#ffbf69');
    texto('Nadá con las flechas y reventá las burbujas del color que te piden', W / 2, H * 0.58, 3.3, '#d7f3ff');
    texto('Si reventás una de otro color, perdés una vida', W / 2, H * 0.64, 3.3, '#d7f3ff');
    texto('Presioná Enter para zambullirte', W / 2, H * 0.8, 5, '#ffd23f');
    return;
  }

  for (const b of burbujas) dibujarBurbuja(b);
  dibujarPez(pez.x * W, pez.y * H, pez.mira, t);

  // Cartel con el color pedido (titila cuando recién cambia)
  const color = COLORES[objetivo];
  if (aviso <= 0 || Math.floor(t * 8) % 2 === 0) texto(`¡Reventá las ${color.nombre}!`, W / 2, 8 * u, 5.5, color.valor);

  ctx.font = `bold ${4.5 * u}px "Trebuchet MS", sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd23f';
  ctx.fillText(`Puntos: ${puntos}`, 3 * u, 15 * u);
  ctx.textAlign = 'right';
  ctx.fillText('❤️'.repeat(Math.max(vidas, 0)), W - 3 * u, 15 * u);

  if (destello > 0) {
    ctx.fillStyle = `rgba(255, 60, 60, ${destello})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (estado === 'fin') {
    ctx.fillStyle = 'rgba(5, 38, 58, 0.8)';
    ctx.fillRect(0, 0, W, H);
    texto('¡Glu glu, se terminó!', W / 2, H * 0.4, 8, '#ffbf69');
    texto(`Reventaste ${puntos} burbujas · Récord: ${record}`, W / 2, H * 0.52, 5, '#d7f3ff');
    texto('Enter para nadar de nuevo', W / 2, H * 0.68, 5, '#ffd23f');
  }
}

// --- Bucle principal ---
let anterior = performance.now();
function bucle(ahora) {
  const dt = Math.min((ahora - anterior) / 1000, 0.05);
  anterior = ahora;
  if (estado === 'jugando') actualizar(dt);
  dibujar(ahora / 1000);
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);
</script>
</body>
</html>
